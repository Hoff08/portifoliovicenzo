<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photography Portfolio | DaVinci Focus</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #000;
            color: #e0e0e0;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
        }

        /* --- CABEÇALHO --- */
        header {
            padding: 80px 20px 60px;
            text-align: center;
        }

        .section-title {
            font-weight: 200;
            font-size: 14px;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #aaa;
            margin-bottom: 30px;
            margin-top: 60px;
        }

        /* --- ÍCONE DAVINCI CENTRALIZADO --- */
        .software-glass {
            width: 100px;
            height: 100px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            margin: 0 auto;
            transition: 0.4s ease;
        }

        .software-glass img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .software-glass:hover {
            transform: scale(1.1);
            border-color: rgba(255, 255, 255, 0.4);
        }

        /* --- GRID AMPLIADO (IMAGENS GRANDES) --- */
        .photo-session {
            display: grid;
            grid-template-columns: repeat(5, 1fr); 
            gap: 20px;
            max-width: 1600px;
            margin: 0 auto 100px;
            padding: 0 40px;
        }

        .card {
            position: relative;
            border-radius: 15px;
            overflow: hidden;
            text-decoration: none;
            transition: all 0.5s cubic-bezier(0.2, 1, 0.3, 1);
            display: block;
            border: 1px solid rgba(255, 255, 255, 0.1);
            aspect-ratio: 4 / 5; /* Formato Instagram Vertical */
        }

        .card:hover {
            transform: scale(1.04);
            border-color: rgba(255, 255, 255, 0.5);
            z-index: 10;
            box-shadow: 0 25px 50px rgba(0,0,0,0.9);
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.8);
            transition: 0.6s ease;
        }

        .card:hover img {
            filter: brightness(1);
        }

        .card span {
            position: absolute;
            bottom: 20px;
            left: 20px;
            font-size: 12px;
            font-weight: 600;
            color: #fff;
            z-index: 10;
            text-transform: uppercase;
            background: rgba(0, 0, 0, 0.6);
            padding: 8px 15px;
            border-radius: 8px;
            backdrop-filter: blur(8px);
        }

        /* Responsividade */
        @media (max-width: 1200px) {
            .photo-session { grid-template-columns: repeat(3, 1fr); padding: 0 20px; }
        }
        @media (max-width: 768px) {
            .photo-session { grid-template-columns: repeat(2, 1fr); gap: 10px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="software-glass">
            <img src="davinci.png" alt="DaVinci Resolve">
