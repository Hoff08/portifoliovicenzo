<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Portfolio | Glassmorphism Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #000;
            color: #e0e0e0;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
        }

        /* --- CABEÇALHO --- */
        header {
            padding: 60px 20px 40px;
            text-align: center;
        }

        .section-title {
            font-weight: 200;
            font-size: 13px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #aaa;
            margin-bottom: 18px;
        }

        .badges-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 45px;
        }

        /* --- EFEITO GLASSMORPHISM --- */
        .glass-badge {
            background: rgba(255, 255, 255, 0.05); /* Fundo branco bem transparente */
            backdrop-filter: blur(10px); /* O segredo do efeito vidro */
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15); /* Borda fina clara */
            border-radius: 50px;
            padding: 10px 22px;
            font-size: 12px;
            font-weight: 400;
            color: #fff;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .glass-badge:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.4);
            transform: translateY(-3px);
        }

        /* Estilo para as logos de software também em glass */
        .software-glass {
            width: 65px;
            height: 65px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            transition: 0.3s;
        }

        .software-glass img {
            width: 100%;
            height: auto;
            border-radius: 6px;
        }

        .software-glass:hover {
            border-color: #fff;
            background: rgba(255, 255, 255, 0.1);
        }

        /* --- GRID DE VÍDEOS --- */
        .main-grid {
            display: grid;
            grid-template-columns: 1.5fr 1fr 1fr;
            grid-template-rows: 300px 300px;
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto 80px;
            padding: 0 20px;
        }

        .card {
            position: relative;
            border-radius: 15px;
            overflow: hidden;
            text-decoration: none;
            transition: all 0.5s cubic-bezier(0.2, 1, 0.3, 1);
            display: block;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .card:hover {
            transform: scale(1.02);
            border-color: rgba(255, 255, 255, 0.3);
            z-index: 2;
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.4);
            transition: 0.5s;
        }

        .card:hover img {
            filter: brightness(0.7);
        }

        .card span {
            position: absolute;
            bottom: 25px;
            left: 25px;
            font-size: 14px;
            font-weight: 600;
            color: #fff;
            z-index: 10;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .shorts-column {
            grid-column: 3 / 4;
            grid-row: 1 / 3;
            display: grid;
            grid-template-rows: repeat(3, 1fr);
            gap: 15px;
        }

        @media (max-width: 900px) {
            .main-grid { display: flex; flex-direction: column; }
            .card, .shorts-column { height: 250px; }
            .shorts-column { display: flex; flex-direction: column; height: auto; }
            .shorts-column .card { height: 200px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="section-title">Aplicativos de edição:</div>
        <div class="badges-container">
            <div class="software-glass">
                <img src="davinci.png" alt="DaVinci">
            </div>
            <div class="software-glass">
                <img src="capcut.png" alt="CapCut">
            </div>
        </div>

        <div class="section-title">Experiente em:</div>
        <div class="badges-container">
            <div class="glass-badge">Color Grading</div>
            <div class="glass-badge">Vídeo para Reels</div>
            <div class="glass-badge">Documentários</div>
            <div class="glass-badge">Vídeos Cinemáticos</div>
        </div>
    </header>

 <div class="main-grid">

            <span>Video Consientização - Trabalho colégio</span>
            <img src="documentario.png">
        </a>

        <a href="https://youtube.com/shorts/QjasLly8bsg" target="_blank" class="card" style="grid-column: 1/2;">
            <span>Video Academia - Ronaldy </span>
            <img src="academia.png">
        </a>
        <a href="https://youtu.be/77uWs1yUg1o" target="_blank" class="card" style="grid-column: 2/3;">
            <span>Parodia - Trabalho colégio</span>
            <img src="parodia.png">
        </a>

        <div class="shorts-column">
            <a href="https://youtube.com/shorts/3n452En0754?si=uSxopBwXAqwaZhGj" target="_blank" class="card">
                <span>Video - Churras do Chris</span>
                <img src="chris.png">
            </a>
            <a href="https://youtube.com/shorts/9se_-qVO7hM" target="_blank" class="card">
                <span>Video - Tio Pedrinho</span>
                <img src="pedrinho.png">
            </a>
            <a href="https://youtube.com/shorts/Ahy_3u0Fxhc" target="_blank" class="card">
                <span>Color Grading - Iokai Sushi</span>
                <img src="color.png">
            </a>
        </div>
    </div>

</body>
</html>
